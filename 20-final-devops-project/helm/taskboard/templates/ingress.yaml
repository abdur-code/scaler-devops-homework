{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: taskboard}
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      # Fix: was taskboard-backend:8080. No Service has that name (the backend Service is
      # "backend", see backend-service.yaml) and the backend listens on 8000, so /api got 503.
      - {path: /api, pathType: Prefix, backend: {service: {name: backend, port: {number: 8000}}}}
      - {path: /, pathType: Prefix, backend: {service: {name: taskboard-frontend, port: {number: 80}}}}
{{- end }}
