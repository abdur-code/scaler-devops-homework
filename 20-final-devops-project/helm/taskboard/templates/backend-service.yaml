apiVersion: v1
kind: Service
metadata:
  # Fix: was "<release>-taskboard-backend" (taskboard-taskboard-backend).
  # The frontend image's nginx.conf proxies /api/ to http://backend:8000, the same name
  # Docker Compose uses. With no Service called "backend", nginx exits with
  # 'host not found in upstream "backend"' and the frontend Pods crash-loop.
  name: backend
  labels: {app: taskboard-backend}
spec:
  selector: {app: taskboard-backend}
  ports:
    - port: 8000
      targetPort: 8000
      name: http
