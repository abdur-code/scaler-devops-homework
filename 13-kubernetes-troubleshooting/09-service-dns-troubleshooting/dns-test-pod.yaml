apiVersion: v1
kind: Pod

metadata:
  name: dns-test

spec:
  containers:
    - name: dns-test
      # Fix: the lecture copy used registry.k8s.io/e2e-test-images/dnsutils:1.3, which does
      # not exist (ErrImagePull "not found"). The Kubernetes test image with nslookup/dig is
      # called jessie-dnsutils, and tag 1.3 is published for arm64 as well as amd64.
      # Note: this image has nslookup and dig but no wget/curl, so the README's HTTP test
      # (kubectl exec dns-test -- wget ...) is done from a throwaway busybox Pod instead.
      image: registry.k8s.io/e2e-test-images/jessie-dnsutils:1.3
      command:
        - sleep
        - "3600"
