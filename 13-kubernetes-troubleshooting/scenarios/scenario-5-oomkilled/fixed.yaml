# Final fix: right-size the work to the memory budget instead of handing a test Pod
# ~1.2Gi on a shared 8Gi node. 15 x 10 MiB = 150 MiB of data plus ~15 MiB for Python fits
# under a 256Mi limit with headroom. A request is set so the scheduler reserves it.
# restartPolicy OnFailure: the script exits 0 when done (same issue as scenario 1).
apiVersion: v1
kind: Pod
metadata:
  name: fail-5-oomkilled-pod
  labels:
    tier: triage-gauntlet
    scenario: oomkilled
spec:
  restartPolicy: OnFailure
  containers:
    - name: memory-leaker
      image: python:3.11-alpine
      command:
        - "python3"
        - "-c"
        - |
          print("Allocating memory in a bounded way...")
          chunks = []
          for i in range(15):
              chunks.append(b"x" * (10 * 1024 * 1024))
          print(f"Done: holding {len(chunks) * 10} MiB, exiting cleanly")
      resources:
        requests:
          memory: "192Mi"
        limits:
          memory: "256Mi"
