# Fix: request what the app actually needs. The single minikube node has 15 CPUs and
# about 7.7Gi of memory, so 500 CPUs / 1000Gi can never fit anywhere.
apiVersion: v1
kind: Pod
metadata:
  name: fail-3-pending-pod
  labels:
    tier: triage-gauntlet
    scenario: pending
spec:
  containers:
    - name: hungry-app
      image: nginx:alpine
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "250m"
          memory: "128Mi"
