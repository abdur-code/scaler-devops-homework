# Final fix: DATABASE_URL is set (root cause 1), and restartPolicy is OnFailure because
# this is a run-to-completion script (root cause 2). With the default "Always", a clean
# exit 0 is restarted forever and ends up in CrashLoopBackOff anyway.
apiVersion: v1
kind: Pod
metadata:
  name: fail-1-crashloop-pod
  labels:
    tier: triage-gauntlet
    scenario: crashloop
spec:
  restartPolicy: OnFailure
  containers:
    - name: python-app
      image: python:3.11-alpine
      env:
        - name: DATABASE_URL
          value: "postgresql://postgres-db.troubleshooting-lab.svc.cluster.local:5432/app"
      command:
        - "python3"
        - "-c"
        - |
          import os, sys
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print("Application started successfully!")
