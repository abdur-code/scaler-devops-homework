# Addition (not in the lecture files): same as jobs-steps.yml, plus the
# `needs: build` line that section 6 of the 05-jobs-and-steps notes describes,
# so the Test Job waits for the Build Job instead of running in parallel.
name: Jobs and Steps Demo (with needs)
on:
  workflow_dispatch:
jobs:
  build:
    name: Build Job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Build application
        run: echo "Building application..."
      - name: Build completed
        run: echo "Build successful!"
  test:
    name: Test Job
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Test 1
        run: echo "Running test 1"
      - name: Test 2
        run: echo "Running test 2"
      - name: Tests completed
        run: echo "All tests passed!"
